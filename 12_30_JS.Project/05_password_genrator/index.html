<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Password Genrator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Genrate a <br><span>Random Password</span></h1>
        <div class="display">
            <input type="text" id="password" placeholder="passsword">
            <img src="images/copy.png" onclick="copyPassword()">
        </div>
        <button onclick="createPasword()"><img src="images/generate.png">Genrate Password</button>
    </div>

    <script>
        const passwordBox=document.getElementById("password");
        const length =12;

        const upperCase="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const loweCase="abcdefghijklmnopqrstuvwxyz";
        const number = "0123456789";
        const symbol = "@#$%^&*()_+|}{[]></-=";

        const allchars = upperCase+loweCase+number+symbol;


        function createPasword(){
            let password="";
            password += upperCase[Math.floor(Math.random()*upperCase.length)];
            password += loweCase[Math.floor(Math.random()*loweCase.length)];
            password += number[Math.floor(Math.random()*number.length)];
            password += symbol[Math.floor(Math.random()*symbol.length)];

            while(length>password.length){
                    password += allchars[Math.floor(Math.random()*allchars.length)];
            }
            passwordBox.value = password;
        }


        function copyPassword(){
            passwordBox.select();
            document.execCommand("copy");
        }

    </script>
</body>
</html>
